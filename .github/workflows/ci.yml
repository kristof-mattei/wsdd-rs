# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # each new commit to a PR runs this workflow
  # so we need to avoid a long running older one from overwriting the "pr-<number>-latest"
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_VARIANTS: |-
    arm64
    amd64
    amd64/v2
    amd64/v3
  REGISTRY: ghcr.io

jobs:
  architectures:
    name: Build matrix
    runs-on: ubuntu-slim
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    outputs:
      architectures: ${{ steps.matrix.outputs.architectures }}
    steps:
      - name: Build matrix
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: matrix
        with:
          script: |
            const architectures = process.env.IMAGE_VARIANTS.trim().split("\n").map((a) => a.trim());

            const json = JSON.stringify(architectures);

            core.setOutput("architectures", json);

  rust-build:
    name: Build Rust code
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    uses: $/.github/workflows/rust.yml
    permissions:
      checks: write # publish-unit-test-result-action creates a check run
      contents: read
      id-token: write # codecov-action authenticates over OIDC
      issues: read # publish-unit-test-result-action needs this in private repos
      pull-requests: write # publish-unit-test-result-action comments the test summary

  repo-has-container:
    name: Repo has container?
    runs-on: ubuntu-slim
    outputs:
      has_container: ${{ steps.determine.outputs.has_container }}
    steps:
      - name: Repo has docker container?
        shell: bash
        id: determine
        env:
          HAS_CONTAINER: ${{ vars.HAS_CONTAINER }}
        run: |
          echo "has_container=${HAS_CONTAINER:-false}" >> "${GITHUB_OUTPUT}"

  repo-has-deb:
    name: Repo has deb?
    runs-on: ubuntu-slim
    outputs:
      has_deb: ${{ steps.determine.outputs.has_deb }}
    steps:
      - name: Repo publishes a Debian package?
        shell: bash
        id: determine
        env:
          HAS_DEB: ${{ vars.HAS_DEB }}
        run: |
          echo "has_deb=${HAS_DEB:-false}" >> "${GITHUB_OUTPUT}"

  release-base-artifacts:
    name: Release base artifacts are on main
    runs-on: ubuntu-slim
    permissions:
      actions: read # list the retag runs for the base commit
      contents: read
    needs:
      - repo-has-container
      - repo-has-deb
    if: |
      startsWith(github.head_ref, 'release/v') &&
      (
        fromJSON(needs.repo-has-container.outputs.has_container) == true ||
        fromJSON(needs.repo-has-deb.outputs.has_deb) == true
      )
    steps:
      - name: Wait for the base commit's retag run to succeed
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_REPO: ${{ github.repository }} # no checkout, so gh cannot infer the repository from a git remote
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release PRs build no container and no Debian package, so the retag run for their merge commit falls back to
          # the `sha-<base>-*` tag, which the retag run for the base commit creates.
          # Merging before that run has finished makes the merge commit's retag fail.
          url=""
          conclusion=""

          for attempt in $(seq 1 30); do
            if ((attempt > 1)); then
              sleep 30
            fi

            echo "Looking for the retag run of ${BASE_SHA} (attempt ${attempt} of 30)"

            # || true: no run yet, or a transient api error, both mean retry
            run=$(gh run list \
              --workflow retag-containers-after-push.yml \
              --event push \
              --commit "${BASE_SHA}" \
              --limit 1 \
              --json status,conclusion,url \
              --jq '.[0] // empty') || true

            if [ -z "${run}" ]; then
              echo "No retag run found yet"
              continue
            fi

            status=$(jq --raw-output '.status' <<< "${run}")
            url=$(jq --raw-output '.url' <<< "${run}")

            if [ "${status}" = "completed" ]; then
              conclusion=$(jq --raw-output '.conclusion' <<< "${run}")
              break
            fi

            echo "Retag run ${url} is ${status}"
          done

          if [ -z "${url}" ]; then
            echo "::error::No retag run found for base commit ${BASE_SHA}"
            exit 1
          fi

          if [ -z "${conclusion}" ]; then
            echo "::error::Retag run ${url} for base commit ${BASE_SHA} did not complete in time"
            exit 1
          fi

          if [ "${conclusion}" != "success" ]; then
            echo "::error::Retag run ${url} for base commit ${BASE_SHA} ended with ${conclusion}. Re-run it, then re-run this check."
            exit 1
          fi

          echo "Retag run ${url} succeeded"

  changes:
    name: Detect changes
    runs-on: ubuntu-slim
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    permissions:
      contents: read
      pull-requests: read # dorny/paths-filter reads the PR's changed files
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # on push events dorny/paths-filter diffs against github.event.before over git and fetches it with the persisted credentials
          persist-credentials: true
          show-progress: false

      - name: Check if we actually made changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filters: .github/file-filters.yml

  calculate-version:
    name: Calculate version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    needs:
      - changes
      - repo-has-container
      - repo-has-deb
    outputs:
      version: ${{ steps.version.outputs.version }}
    # a PR without a Rust or Docker change can still move the predicted version, so a deb is built on every PR
    if: |
      github.event_name == 'pull_request' &&
      (
        (
          fromJSON(needs.repo-has-container.outputs.has_container) == true &&
          (
            fromJSON(needs.changes.outputs.docker) == true ||
            fromJSON(needs.changes.outputs.rust) == true
          )
        ) ||
        fromJSON(needs.repo-has-deb.outputs.has_deb) == true
      )
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          fetch-depth: 0

      - name: Install git-cliff to generate changelog & next version number
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: git-cliff

      - name: Calculate next version
        shell: bash
        id: version
        run: |
          latest_tag=$(git describe --tags --abbrev=0 || true)

          # The release branch contains .cliffignore and git-cliff applies it to --bumped-version as well, which would leave the hidden commits out of the version.
          rm --force .cliffignore

          bumped=$(git-cliff --bumped-version --unreleased --offline)

          # If git-cliff didn't bump (e.g. chore/ci only commits), force a patch increment
          # so we never tag a Docker image with the same version as the last release.
          if [ "${bumped}" = "${latest_tag}" ]; then
            bumped=$(git-cliff --bumped-version --bump patch --unreleased --offline)
            echo "Force bumping to ${bumped}"
          fi

          # tags are vX.Y.Z, cargo versions are not prefixed
          echo "version=${bumped#v}" >> "${GITHUB_OUTPUT}"

  prepare-variables:
    name: Prepare variables and version bump patch
    runs-on: ubuntu-26.04
    outputs:
      application_name: ${{ steps.variables.outputs.application_name }}
      description: ${{ steps.variables.outputs.description }}
      full_deb_name_remote_registry: ${{ steps.variables.outputs.full_deb_name_remote_registry }}
      full_image_name_remote_registry: ${{ steps.variables.outputs.full_image_name_remote_registry }}
      full_image_name_cache_registry: ${{ steps.variables.outputs.full_image_name_cache_registry }}
      full_image_name_local_registry: ${{ steps.variables.outputs.full_image_name_local_registry }}
      registry: ${{ steps.variables.outputs.registry }}
      unique_tag: ${{ steps.variables.outputs.unique_tag }}
    needs:
      - repo-has-container
      - repo-has-deb
      - calculate-version
    if: |
      fromJSON(needs.repo-has-container.outputs.has_container) == true ||
      fromJSON(needs.repo-has-deb.outputs.has_deb) == true
    steps:
      - &checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Install cargo-edit to do set-version
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-edit

      - name: Update Cargo.toml's version
        shell: bash
        env:
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          cargo set-version "${VERSION}"

          git diff

      - name: Store version bump diff
        shell: bash
        run: |
          git diff > /tmp/version-bump.patch

      - name: Upload version bump patch
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: version-bump-patch
          path: /tmp/version-bump.patch
          retention-days: 1

      - name: Variables
        shell: bash
        id: variables
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The application name, used in the Dockerfile
          # split at the last / and keep that (kristof-mattei/repo-name -> repo-name)
          application_name="${IMAGE_NAME##*/}"
          # lowercase
          application_name="${application_name,,}"
          echo "application_name=${application_name}" >> "${GITHUB_OUTPUT}"

          # The application's description, from Cargo.toml
          description=$(cargo metadata --format-version 1 --no-deps | jq ".packages.[] | select(.name == \"${application_name}\") | .description" --raw-output)
          printf "%s\n" \
              "description<<EOF" \
              "$description" \
              "EOF" >> "$GITHUB_OUTPUT"

          # This is the unique docker tag
          unique_tag="pr-${BASE_SHA}-${HEAD_SHA}"
          echo "unique_tag=${unique_tag}" >> "${GITHUB_OUTPUT}"

          # The registry to which we'll push
          registry="${REGISTRY,,}"
          echo "registry=${registry}" >> "${GITHUB_OUTPUT}"

          # The final full image name, which is the registry, the owner and the repo name
          image_name="${IMAGE_NAME,,}"

          {
            echo "full_image_name_remote_registry=${registry}/${image_name}"
            echo "full_deb_name_remote_registry=${registry}/${image_name}-deb"
            # The cache registry, separate from the main image registry
            echo "full_image_name_cache_registry=${registry}/${image_name}-cache"
          } >> "${GITHUB_OUTPUT}"

          # The local registry to which we'll push
          local_registry=localhost:5000
          local_registry=${local_registry,,}
          echo "full_image_name_local_registry=${local_registry}/${image_name}" >> "${GITHUB_OUTPUT}"

  docker-build:
    name: Build Docker container on ${{ matrix.runs-on }} for ${{ matrix.platform }}
    strategy:
      matrix:
        runs-on:
          - "ubuntu-26.04"
          - "ubuntu-26.04-arm"
        platform: ${{ fromJSON(needs.architectures.outputs.architectures) }}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: read
      packages: write # push the build cache to ghcr.io
    needs:
      - calculate-version
      - architectures
      - prepare-variables
      - changes
      - repo-has-container
    if: |
      fromJSON(needs.repo-has-container.outputs.has_container) == true &&
      (
        fromJSON(needs.changes.outputs.docker) == true ||
        fromJSON(needs.changes.outputs.rust) == true
      )
    steps:
      - *checkout

      - name: Download version bump patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-bump-patch
          path: .

      # TODO validate no changes between github.event.pull_request.head.sha and the actual current sha (representing the hypothetical merge)
      - name: Set variables
        shell: bash
        id: variables
        env:
          CACHE_IMAGE_NAME: ${{ needs.prepare-variables.outputs.full_image_name_cache_registry }}
          PLATFORM: ${{ matrix.platform }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UNIQUE_TAG: ${{ needs.prepare-variables.outputs.unique_tag }}
        run: |
          # remove slashes from platform (`amd64/v3` -> `amd64-v3`)
          platform_no_slashes="${PLATFORM//\//-}"
          echo "platform_no_slashes=${platform_no_slashes}" >> "${GITHUB_OUTPUT}"

          # but we're only building 1 arch here, so we need to identify that container (we'll merge them later)
          echo "unique_tag_arch=${UNIQUE_TAG}-${platform_no_slashes}" >> "${GITHUB_OUTPUT}"

          runner_arch="${RUNNER_ARCH,,}"
          echo "buildcache_pr_ref=${CACHE_IMAGE_NAME}:buildcache-pr-${PR_NUMBER}-${runner_arch}-${platform_no_slashes}" >> "${GITHUB_OUTPUT}"
          echo "buildcache_main_ref=${CACHE_IMAGE_NAME}:buildcache-main-${runner_arch}-${platform_no_slashes}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry ${{ needs.prepare-variables.outputs.registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ${{ needs.prepare-variables.outputs.registry }}
          username: ${{ github.actor }}

      - name: Should we set up QEMU?
        shell: bash
        id: setup_qemu
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          if ! dpkg-architecture --equal "${PLATFORM%/*}"; then
            echo "setup_qemu=true" >> "${GITHUB_OUTPUT}"
          else
            echo "setup_qemu=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
        if: fromJSON(steps.setup_qemu.outputs.setup_qemu) == true
        with:
          platforms: linux/${{ matrix.platform }}
          cache-image: false

      - name: Extract Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          annotations: |
            org.opencontainers.image.description=${{ needs.prepare-variables.outputs.description }} (${{ matrix.platform }})
            org.opencontainers.image.revision=${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=${{ github.event.pull_request.html_url }}
            org.opencontainers.image.version=v${{ needs.calculate-version.outputs.version }}
          labels: |
            org.opencontainers.image.description=${{ needs.prepare-variables.outputs.description }} (${{ matrix.platform }})
            org.opencontainers.image.revision=${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=${{ github.event.pull_request.html_url }}
            org.opencontainers.image.version=v${{ needs.calculate-version.outputs.version }}
          images: ${{ needs.prepare-variables.outputs.full_image_name_local_registry }}
          tags: |
            type=raw,value=${{ steps.variables.outputs.unique_tag_arch }}

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: |
            APPLICATION_NAME=${{ needs.prepare-variables.outputs.application_name }}
          context: .
          # this container is THE PR's artifact, and we will re-tag it
          # once the PR has been accepted
          cache-from: |
            type=registry,ref=${{ steps.variables.outputs.buildcache_pr_ref }}
            type=registry,ref=${{ steps.variables.outputs.buildcache_main_ref }}
          # fork PRs run with a read-only token, which cannot push the build cache
          cache-to: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('type=registry,ref={0},mode=max', steps.variables.outputs.buildcache_pr_ref) || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=oci,dest=/tmp/${{ steps.variables.outputs.unique_tag_arch }}.tar
          platforms: linux/${{ matrix.platform }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: |
          matrix.runs-on == 'ubuntu-26.04'
        with:
          if-no-files-found: error
          name: container-${{ needs.prepare-variables.outputs.application_name }}-${{ steps.variables.outputs.platform_no_slashes }}
          path: /tmp/${{ steps.variables.outputs.unique_tag_arch }}.tar
          retention-days: 1

  docker-publish:
    name: Publish Docker container
    runs-on: ubuntu-26.04
    services:
      registry:
        image: registry:3@sha256:1be55279f18a2fe1a74edf2664cac61c1bea305b7b4642dab412e7affdcb3e33
        ports:
          - 5000:5000
    outputs:
      digest: ${{ steps.local_image.outputs.digest }}
    permissions:
      packages: write # push the PR's image to ghcr.io
    needs:
      - calculate-version
      - prepare-variables
      - docker-build
      - deb-build
      - rust-build
    # after a partial publish a bypassed merge would promote a container and a deb from different commits, so a PR publishes both or neither
    # Check if the event is not triggered by a fork
    if: |
      !cancelled() &&
      needs.docker-build.result == 'success' &&
      needs.rust-build.result == 'success' &&
      (
        needs.deb-build.result == 'success' ||
        needs.deb-build.result == 'skipped'
      ) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request'
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry ${{ needs.prepare-variables.outputs.registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ needs.prepare-variables.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          annotations: |
            org.opencontainers.image.description=${{ needs.prepare-variables.outputs.description }}
            org.opencontainers.image.revision=${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
            org.opencontainers.image.source=${{ github.event.pull_request.html_url }}
            org.opencontainers.image.version=v${{ needs.calculate-version.outputs.version }}
          images: ${{ needs.prepare-variables.outputs.full_image_name_remote_registry }}
          tags: |
            type=raw,value=${{ needs.prepare-variables.outputs.unique_tag }}
            type=ref,event=pr,suffix=-latest

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifact
        with:
          merge-multiple: true
          path: /tmp/container/
          pattern: container-${{ needs.prepare-variables.outputs.application_name }}-*

      - name: Load individual platform images from artifacts & push to registry
        shell: bash
        working-directory: ${{ steps.artifact.outputs.download-path }}
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
          LOCAL_IMAGE_NAME: ${{ needs.prepare-variables.outputs.full_image_name_local_registry }}
          UNIQUE_TAG: ${{ needs.prepare-variables.outputs.unique_tag }}
        run: |
          platforms=()
          while IFS= read -r platform; do
            echo "Loading ${platform//\//-}:"
            docker load --input "./${UNIQUE_TAG}-${platform//\//-}.tar"

            full_name_with_platform="${LOCAL_IMAGE_NAME}:${UNIQUE_TAG}-${platform//\//-}"

            echo "Pushing ${platform//\//-}:"
            docker push "$full_name_with_platform"

            platforms+=("$full_name_with_platform")
          done <<< "${IMAGE_VARIANTS}"

          new_annotations=()
          while IFS= read -r annotation; do
            [[ -z "${annotation}" ]] && continue
            # imagetools create builds an index; convert manifest-level annotations to index-level
            annotation="${annotation/manifest:/index:}"
            new_annotations+=(--annotation)
            new_annotations+=("${annotation}")
          done <<< "${ANNOTATIONS}"

          # merge the platform containers in a new multiplatform one
          # with the new annotations, and push it to our local registry
          docker buildx imagetools create "${new_annotations[@]}" --tag "${LOCAL_IMAGE_NAME}:${UNIQUE_TAG}" \
            "${platforms[@]}"

          echo "Inspecting ${LOCAL_IMAGE_NAME}:${UNIQUE_TAG}:"
          docker buildx imagetools inspect --raw "${LOCAL_IMAGE_NAME}:${UNIQUE_TAG}"

      - name: Get digest of image in our local registry
        shell: bash
        id: local_image
        env:
          LOCAL_IMAGE_NAME: ${{ needs.prepare-variables.outputs.full_image_name_local_registry }}
          UNIQUE_TAG: ${{ needs.prepare-variables.outputs.unique_tag }}
        run: |
          digest=$(docker buildx imagetools inspect "${LOCAL_IMAGE_NAME}:${UNIQUE_TAG}" --format "{{json .}}" | jq --raw-output ".manifest.digest")

          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Push from local registry to remote with new tags
        shell: bash
        env:
          LOCAL_IMAGE_NAME: ${{ needs.prepare-variables.outputs.full_image_name_local_registry }}
          NEW_TAGS: ${{ steps.meta.outputs.tags }}
          UNIQUE_TAG: ${{ needs.prepare-variables.outputs.unique_tag }}
        run: |
          source="docker://${LOCAL_IMAGE_NAME}:${UNIQUE_TAG}"

          # skopeo's --retry-times does not retry a bare 500, so retry at the shell level too
          copy_with_retries() {
            local tag="$1"
            local attempt

            for attempt in 1 2 3; do
              if ((attempt > 1)); then
                sleep 5
              fi

              echo "Copying ${source} to ${tag} (attempt ${attempt} of 3)"

              if skopeo copy --all --preserve-digests --src-tls-verify=false --command-timeout 70s --retry-times 5 "${source}" "docker://${tag}"; then
                return 0
              fi
            done

            echo "::error::Copy of ${source} to ${tag} failed after 3 attempts"
            return 1
          }

          exit_code=0

          # this used to be parallel, but that gives occasional error 500 with ghcr.io:
          # https://github.com/orgs/community/discussions/187118
          # try to upload all of them, if one of them fails, upload the other ones and fail
          while IFS= read -r tag; do
            copy_with_retries "${tag}" || exit_code=1
          done <<< "${NEW_TAGS}"

          exit "${exit_code}"

      - name: Inspect new remote tags
        shell: bash
        env:
          NEW_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r new_tag; do
            echo "Inspecting ${new_tag}:"

            skopeo inspect --raw --command-timeout 70s --retry-times 5 "docker://${new_tag}"

            # empty to get newline
            echo ""
          done <<< "${NEW_TAGS}"

  docker-attest:
    name: Attest Docker container
    runs-on: ubuntu-26.04
    permissions:
      artifact-metadata: write # actions/attest
      attestations: write # actions/attest
      contents: read
      id-token: write # actions/attest
      packages: write # actions/attest pushes the attestation to ghcr.io
      pull-requests: write # docker/scout-action posts the comparison as a PR comment
    needs:
      - prepare-variables
      - docker-build
      - docker-publish
    # Check if the event is not triggered by a fork
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request'
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@77e84dbf09b47d1e29270283c22f16145aa85ca1 # v5.4.0
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry ${{ needs.prepare-variables.outputs.registry }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ needs.prepare-variables.outputs.registry }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # note that we use the digest of the local image
      # these digests don't change after pushing, but
      # since we deal with tags (mutable), and the way to get a digest is to use the tag, I prefer
      # sourcing the digest from the local registry we just spun up (trusted)
      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attestation
        with:
          subject-name: ${{ needs.prepare-variables.outputs.full_image_name_remote_registry }}
          subject-digest: ${{ needs.docker-publish.outputs.digest }}
          push-to-registry: true

      - name: Docker Scout Compare (linux/amd64)
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: compare
          image: "${{ needs.prepare-variables.outputs.full_image_name_remote_registry }}:pr-${{ github.event.pull_request.number }}-latest"
          platform: linux/amd64
          to: "${{ needs.prepare-variables.outputs.full_image_name_remote_registry }}:edge"
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          organization: ${{ vars.DOCKERHUB_USERNAME }}

      - name: Docker Scout Compare (linux/arm64)
        uses: docker/scout-action@7c6b6c3f7844478ace1ffd4e7aef649053d1f87d # v1.24.0
        with:
          command: compare
          image: "${{ needs.prepare-variables.outputs.full_image_name_remote_registry }}:pr-${{ github.event.pull_request.number }}-latest"
          platform: linux/arm64
          to: "${{ needs.prepare-variables.outputs.full_image_name_remote_registry }}:edge"
          dockerhub-user: ${{ vars.DOCKERHUB_USERNAME }}
          dockerhub-password: ${{ secrets.DOCKERHUB_TOKEN }}
          organization: ${{ vars.DOCKERHUB_USERNAME }}

  deb-build:
    name: Build Debian package (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - runs-on: ubuntu-26.04
            arch: amd64
          - runs-on: ubuntu-26.04-arm
            arch: arm64
    runs-on: ${{ matrix.runs-on }}
    # the runner's glibc is newer than Debian stable's, so the build runs in the Dockerfile's image
    container:
      image: rust:1.98.0-slim-trixie@sha256:17d1ba895198f9934c6314ec5346a0d5115372f3243390c3d731e242f35c2f27
    permissions:
      artifact-metadata: write # actions/attest
      attestations: write # actions/attest
      contents: read
      id-token: write # actions/attest
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    needs:
      - repo-has-deb
      - calculate-version
      - prepare-variables
    if: fromJSON(needs.repo-has-deb.outputs.has_deb) == true
    steps:
      - name: Install build and packaging tools
        shell: bash
        run: |
          apt-get update

          # the systemd feature links libsystemd for sd_listen_fds and reqwest links the system OpenSSL, so the build needs both dev packages and pkg-config
          apt-get install --no-install-recommends --yes ca-certificates curl dpkg-dev git libssl-dev libsystemd-dev lintian mold pkg-config

          # the workspace belongs to the runner's user and the container runs as root, git refuses the repository otherwise
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - *checkout

      - name: Set up toolchain
        shell: bash
        run: |
          rustup toolchain install
          rustup show

          cargo --version

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install cargo-deb
        uses: taiki-e/install-action@7b8d4719ee4aaa279bdf55df38dacb9ebfe12a6c # v2.87.6
        with:
          tool: cargo-deb

      - name: Download version bump patch
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: version-bump-patch
          path: ${{ runner.temp }}

      - name: Apply version bump patch
        shell: bash
        run: |
          git apply "${RUNNER_TEMP}/version-bump.patch"

      - name: Stamp Debian changelog with the predicted version
        shell: bash
        env:
          APPLICATION_NAME: ${{ needs.prepare-variables.outputs.application_name }}
          VERSION: ${{ needs.calculate-version.outputs.version }}
        run: |
          # the release version does not exist yet, so the deb carries the version predicted for this PR, checked again at graduation
          maintainer=$(cargo metadata --format-version 1 --no-deps | jq --raw-output --arg name "${APPLICATION_NAME}" '.packages[] | select(.name == $name) | .metadata.deb.maintainer')
          date=$(git log -1 --format=%aD)

          cat > "crates/${APPLICATION_NAME}/packaging/changelog" <<EOF
          ${APPLICATION_NAME} (${VERSION}-1) unstable; urgency=medium

            * See https://github.com/${GITHUB_REPOSITORY}/releases
              for the changelog.

           -- ${maintainer}  ${date}
          EOF

          cat "crates/${APPLICATION_NAME}/packaging/changelog"

      - name: Build Debian package
        shell: bash
        env:
          APPLICATION_NAME: ${{ needs.prepare-variables.outputs.application_name }}
        run: |
          cargo deb --package "${APPLICATION_NAME}" --locked

      - name: Lintian
        shell: bash
        env:
          LC_ALL: C.UTF-8
        run: |
          # no ITP bug and no man page are accepted for a package outside the Debian archive
          lintian --fail-on warning --suppress-tags initial-upload-closes-no-bugs,no-manual-page target/debian/*.deb

      # users download the bare file from the release, so the attestation is on the file's hash, not on a registry digest
      - name: Attest Debian package
        # fork PRs run without id-token
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: target/debian/*.deb

      - name: Upload Debian package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          if-no-files-found: error
          name: deb-${{ matrix.arch }}
          path: target/debian/*.deb
          retention-days: 1

  deb-publish:
    name: Publish Debian packages
    runs-on: ubuntu-26.04
    permissions:
      packages: write # push the PR's debs to ghcr.io
    needs:
      - prepare-variables
      - deb-build
      - docker-build
      - rust-build
    # both artifacts or neither, see docker-publish
    # Check if the event is not triggered by a fork
    if: |
      !cancelled() &&
      needs.deb-build.result == 'success' &&
      needs.rust-build.result == 'success' &&
      (
        needs.docker-build.result == 'success' ||
        needs.docker-build.result == 'skipped'
      ) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event_name == 'pull_request'
    steps:
      - name: Download Debian packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        id: artifact
        with:
          merge-multiple: true
          path: /tmp/deb/
          pattern: deb-*

      - name: Set up ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log into registry ${{ needs.prepare-variables.outputs.registry }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          oras login "${REGISTRY,,}" --username "${GITHUB_ACTOR}" --password-stdin <<< "${GITHUB_TOKEN}"

      - name: Push Debian packages to registry
        shell: bash
        working-directory: ${{ steps.artifact.outputs.download-path }}
        env:
          FULL_DEB_NAME: ${{ needs.prepare-variables.outputs.full_deb_name_remote_registry }}
          UNIQUE_TAG: ${{ needs.prepare-variables.outputs.unique_tag }}
        run: |
          # the two debs go in one artifact, so the retag chain deals with a single reference
          oras push \
            --artifact-type application/vnd.debian.binary-package \
            "${FULL_DEB_NAME}:${UNIQUE_TAG}" \
            ./*.deb

  all-done:
    name: All done
    # this is the job that should be marked as required on GitHub. It's the only one that'll reliably trigger
    # when any upstream fails: success
    # when all upstream skips: pass
    # when all upstream success: success
    # combination of upstream skip and success: success
    runs-on: ubuntu-slim
    permissions: {}
    needs:
      - changes
      - calculate-version
      - prepare-variables
      - rust-build
      - docker-build
      - docker-publish
      - docker-attest
      - deb-build
      - deb-publish
      - release-base-artifacts
    if: |
      !cancelled()
    steps:
      - name: Fail!
        shell: bash
        if: |
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled')
        run: |
          echo "One / more upstream failed or was cancelled. Failing job..."

          exit 1

      - name: Success!
        shell: bash
        run: |
          echo "Great success!"
