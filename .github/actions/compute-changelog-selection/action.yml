# yaml-language-server: $schema=https://json.schemastore.org/github-action.json
name: Compute changelog selection
description: Derive the .cliffignore contents from the release PR body's ballot checkboxes

inputs:
  body:
    description: Release PR body containing the ballot
    required: true

outputs:
  selection-file:
    description: Path to the computed .cliffignore contents
    value: ${{ steps.compute.outputs.selection-file }}
  base-sha:
    description: Commit the release branch is built on
    value: ${{ steps.compute.outputs.base-sha }}

runs:
  using: composite
  steps:
    - name: Compute selection
      id: compute
      shell: bash
      env:
        BODY: ${{ inputs.body }}
      run: |
        # The release branch is always exactly one commit on top of main
        base_sha=$(git rev-parse HEAD~1)
        echo "base-sha=${base_sha}" >> "${GITHUB_OUTPUT}"

        printf '%s' "${BODY}" > "${RUNNER_TEMP}/body.md"

        # Ballot lines look like `- [x] ... (https://.../commit/<sha>)`
        grep --perl-regexp --only-matching '^- \[[x ]\] .*?/commit/\K[0-9a-f]{40}' "${RUNNER_TEMP}/body.md" | sort --unique > "${RUNNER_TEMP}/ballot.txt" || true
        grep --perl-regexp --only-matching '^- \[ \] .*?/commit/\K[0-9a-f]{40}' "${RUNNER_TEMP}/body.md" | sort --unique > "${RUNNER_TEMP}/unchecked.txt" || true

        # Exclusions that predate this release live on the base commit
        git show "${base_sha}:.cliffignore" > "${RUNNER_TEMP}/baseline.txt" 2> /dev/null || true

        # Keep pre-existing exclusions, replace the ballot's with the unchecked set
        awk 'NR == FNR { ballot[$0] = 1; next } !($0 in ballot)' "${RUNNER_TEMP}/ballot.txt" "${RUNNER_TEMP}/baseline.txt" > "${RUNNER_TEMP}/kept.txt"
        cat "${RUNNER_TEMP}/kept.txt" "${RUNNER_TEMP}/unchecked.txt" | sort --unique > "${RUNNER_TEMP}/computed.cliffignore"

        echo "selection-file=${RUNNER_TEMP}/computed.cliffignore" >> "${GITHUB_OUTPUT}"
